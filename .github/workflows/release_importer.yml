name: Build Standalone BYOA Importer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Open-Source Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Minimal Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy pyinstaller

      - name: Run Open-Source Compliance Audit
        run: python scripts/verify_project.py --compliance-audit

      - name: Build BYOA_Importer.exe
        run: python scripts/build_importer_exe.py

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 BYOA_Importer.exe).Hash
          "$hash  BYOA_Importer.exe" | Out-File -Encoding ascii BYOA_Importer.exe.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYOA_Importer-win64
          path: |
            BYOA_Importer.exe
            BYOA_Importer.exe.sha256
